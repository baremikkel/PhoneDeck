# PhoneDeck-konfiguration
# Kopiér til ~/.config/phonedeck/config.toml og ret til.
# Genstart PhoneDeck efter ændringer.

[server]
host = "127.0.0.1"   # kun lokalt – telefonen når den via `adb reverse`
port = 8765
interval = 1.0       # sekunder mellem opdateringer

[github]
# Dit GitHub-brugernavn – viser bidrags-heatmappet (offentlig side, intet token)
# user = "dit-brugernavn"

[gpu]
# name = "Radeon RX 5700 XT"   # overstyr det automatisk fundne navn

# Knapper (Stream Deck) redigeres nu i browseren: http://localhost:8765/editor
