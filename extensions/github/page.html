      <div class="card heat" style="--accent: var(--gh)" data-widget="heatmap" data-widget-name="GitHub-heatmap">
        <header>
          <span class="label">GitHub<span class="sub" data-b="gh.user"></span></span>
          <span class="stats">
            <span><b data-b="gh.total">–</b><small>bidrag · år</small></span>
            <span><b data-b="gh.today">–</b><small>i dag</small></span>
            <span><b data-b="gh.streak">–</b><small>dage i træk</small></span>
          </span>
        </header>
        <canvas class="heatmap" data-heat="github"></canvas>
        <div class="heat-legend"><span>Mindre</span><i style="background:#161b22"></i><i style="background:#0e4429"></i><i style="background:#006d32"></i><i style="background:#26a641"></i><i style="background:#39d353"></i><span>Mere</span><span class="grow"></span><span>Tryk på en dag for detaljer</span></div>
      </div>
