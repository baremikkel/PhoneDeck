<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <title>PhoneDeck</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" hidden></div>
  <div id="offline" hidden>Ingen forbindelse til PC'en – prøver igen …</div>

  <main id="pager">
    <!-- ============ 1. OVERSIGT ============ -->
    <section class="page grid-page" id="p-overview" data-title="Forside"><!-- built from the home layout (/editor#home) --></section>

    <!-- ============ 2. SYSTEM ============ -->
    <section class="page" id="p-system" data-title="System">
      <div class="card a-cpu" style="--accent: var(--cpu)">
        <header><span class="label">CPU</span><button class="mini" data-layout-toggle aria-label="CPU og GPU ved siden af / over hinanden"><i class="ic"></i></button><span class="sub grow right" data-b="cpu.name"></span></header>
        <div class="row">
          <div class="big xl"><span data-b="cpu.load">–</span><small>%</small></div>
          <div class="facts">
            <div><span data-b="cpu.temp" data-temp="cpu">–</span><small>°C</small></div>
            <div><span data-b="cpu.freq">–</span><small>MHz</small></div>
          </div>
        </div>
        <div class="cores" data-cores></div>
        <canvas class="spark" data-chart="cpu"></canvas>
        <div class="legend"><span><i style="background: var(--cpu)"></i>belastning</span><span><i style="background: var(--temp)"></i>temperatur</span></div>
      </div>

      <div class="card a-gpu" style="--accent: var(--gpu)">
        <header><span class="label">GPU</span><span class="sub" data-b="gpu.name"></span></header>
        <div class="row">
          <div class="big xl"><span data-b="gpu.load">–</span><small>%</small></div>
          <div class="facts">
            <div><span data-b="gpu.temp" data-temp="gpu">–</span><small>°C hotspot</small></div>
            <div><span data-b="gpu.edge">–</span><small>°C kant</small></div>
          </div>
        </div>
        <div class="kv">
          <div><small>Strøm</small><span data-b="gpu.power">–</span><small>W</small></div>
          <div><small>Clock</small><span data-b="gpu.clock">–</span><small>MHz</small></div>
          <div><small>Blæser</small><span data-b="gpu.fan">–</span><small>RPM</small></div>
        </div>
        <div class="bar"><i data-w="gpu.vram"></i></div>
        <div class="sub tiny" data-b="gpu.vramtxt"></div>
        <canvas class="spark" data-chart="gpu"></canvas>
        <div class="legend"><span><i style="background: var(--gpu)"></i>belastning</span><span><i style="background: var(--temp)"></i>temperatur</span></div>
      </div>

      <div class="card a-mem" style="--accent: var(--ram)">
        <header><span class="label">Hukommelse</span><span class="sub" data-b="ram.pcttxt"></span></header>
        <div class="big"><span data-b="ram.used">–</span><small data-b="ram.total"></small></div>
        <div class="bar"><i data-w="ram.pct"></i></div>
        <canvas class="spark" data-chart="ram"></canvas>
      </div>

      <div class="card a-net" style="--accent: var(--net)">
        <header><span class="label">Netværk</span></header>
        <div class="kv">
          <div><small>↓ Ned</small><span data-b="net.down">–</span></div>
          <div><small>↑ Op</small><span data-b="net.up">–</span></div>
        </div>
        <canvas class="spark" data-chart="net"></canvas>
      </div>

      <div class="card a-disk" style="--accent: var(--disk)">
        <header><span class="label">Disk</span><span class="sub" data-b="uptime"></span></header>
        <div class="kv">
          <div><small>Brugt</small><span data-b="disk.usage">–</span></div>
          <div><small>I/O</small><span data-b="disk.io">–</span></div>
          <div><small>NVMe</small><span data-b="nvme">–</span></div>
        </div>
        <div class="bar"><i data-w="disk.pct"></i></div>
      </div>
    </section>


    <!-- ============ 6. KNAPPER (Stream Deck – redigeres på /editor) ============ -->
    <section class="page" id="p-buttons" data-title="Knapper">
      <div class="tiles" data-tiles></div>
    </section>
  </main>

  <nav id="dots" aria-label="Sider"></nav>

  <div id="menu" class="sheet" hidden>
    <div class="sheet-card menu-card">
      <header><span class="label">PhoneDeck</span><span class="sub grow right">åbnes på computeren</span><button class="mini" data-menu-close aria-label="Luk"><i class="ic" data-icon="close"></i></button></header>
      <div class="menu-items">
        <button class="tile" data-menu-go="open.settings"><i class="ic" data-icon="gear"></i><span>Indstillinger</span></button>
        <button class="tile" data-menu-go="open.editor"><i class="ic" data-icon="grid"></i><span>Editor</span></button>
      </div>
      <span class="menu-head">Gå til side</span>
      <div class="menu-pages" id="menu-pages"></div>
    </div>
  </div>


  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
