      <div class="card media big-media" data-widget="player" data-widget-name="Musikafspiller (stor)">
        <canvas class="viz" data-viz hidden data-opt="viz" data-opt-name="Visualizer"></canvas>
        <div class="art" data-opt="cover" data-opt-name="Cover"><img data-art alt=""><div class="noart">♪</div></div>
        <div class="info">
          <div class="sub" data-b="m.player" data-opt="player" data-opt-name="Afspillerens navn"></div>
          <div class="title" data-b="m.title">Intet afspilles</div>
          <div class="artist" data-b="m.artist"></div>
          <div class="album sub" data-b="m.album" data-opt="album" data-opt-name="Album"></div>
          <div class="progress" data-opt="progress" data-opt-name="Fremskridt"><i data-w="m.progress"></i></div>
          <div class="times" data-opt="progress" data-opt-name="Fremskridt"><span data-b="m.pos"></span><span data-b="m.len"></span></div>
          <div class="controls">
            <button data-action="media.previous" aria-label="Forrige"><i class="ic" data-icon="prev"></i></button>
            <button data-action="media.playpause" class="primary" aria-label="Afspil/pause"><i class="ic" data-icon="play" data-ib="m.play"></i></button>
            <button data-action="media.next" aria-label="Næste"><i class="ic" data-icon="next"></i></button>
          </div>
          <div class="volume" data-opt="volume" data-opt-name="Lydstyrke">
            <button data-ext="music:volume_down" aria-label="Lavere (kun afspilleren)"><i class="ic" data-icon="minus"></i></button>
            <div class="bar"><i data-w="mv.pct"></i></div>
            <button data-ext="music:volume_up" aria-label="Højere (kun afspilleren)"><i class="ic" data-icon="plus"></i></button>
            <span class="vol mvol" data-b="mv.txt">–</span>
            <button data-viz-toggle aria-label="Visualizer til/fra" title="Visualizer"><i class="ic" data-icon="viz"></i></button>
          </div>
        </div>
      </div>
